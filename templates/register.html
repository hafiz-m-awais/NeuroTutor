<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - NeuroTutor</title>
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dark.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }
      .auth-container {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .auth-container h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 24px;
      }
      .input-group {
        margin-bottom: 16px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        color: var(--subtext);
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        box-sizing: border-box;
        font-size: 14px;
      }
      .input-group input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .auth-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 10px;
      }
      .auth-btn:hover {
        opacity: 0.9;
      }
      .auth-footer {
        margin-top: 20px;
        font-size: 13px;
        color: var(--subtext);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
      }
      .error-msg {
        color: #f44336;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
    </style>
  </head>
  <body class="dark">
    <div class="auth-container">
      <div style="font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 8px;">N</div>
      <h2>Create Account</h2>
      
      <div class="error-msg" id="error-msg"></div>

      <form id="register-form">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••" />
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" required minlength="6" placeholder="••••••••" />
        </div>
        <div class="input-group">
          <label>Security Question (for password recovery)</label>
          <select id="security-question" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px;">
            <option value="" disabled selected>Select a question</option>
            <option value="What was the name of your first pet?">What was the name of your first pet?</option>
            <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
            <option value="What was the name of your elementary school?">What was the name of your elementary school?</option>
            <option value="In what city were you born?">In what city were you born?</option>
          </select>
        </div>
        <div class="input-group">
          <label>Security Answer</label>
          <input type="text" id="security-answer" required placeholder="Your answer" />
        </div>
        <button type="submit" class="auth-btn" id="submit-btn">Sign Up</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>

    <script>
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        const security_question = document.getElementById('security-question').value;
        const security_answer = document.getElementById('security-answer').value;
        const btn = document.getElementById('submit-btn');
        const errEl = document.getElementById('error-msg');
        
        if (password !== confirm) {
            errEl.textContent = "Passwords do not match.";
            errEl.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        errEl.style.display = 'none';

        try {
          const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ email, password, security_question, security_answer })
          });
          
          const data = await res.json();
          if (res.ok) {
            window.location.href = '/';
          } else {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign Up';
          }
        } catch (err) {
          errEl.textContent = 'Connection error.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign Up';
        }
      });
    </script>
  </body>
</html>
