<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - NeuroTutor</title>
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dark.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        font-family: -apple-system, sans-serif;
      }
      .auth-container {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .input-group {
        margin-bottom: 16px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        color: var(--subtext);
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        box-sizing: border-box;
      }
      .auth-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .error-msg { color: #f44336; font-size: 13px; margin-bottom: 16px; display: none; }
      .success-msg { color: #4caf50; font-size: 13px; margin-bottom: 16px; display: none; }
    </style>
  </head>
  <body class="dark">
    <div class="auth-container">
      <h2>Reset Password</h2>
      <p id="step-desc" style="font-size: 14px; color: var(--subtext); margin-bottom: 24px;">Enter your email to find your account.</p>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <!-- Step 1: Email -->
      <div id="step-1">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="reset-email" placeholder="you@example.com" />
        </div>
        <button class="auth-btn" onclick="findAccount()">Find Account</button>
      </div>

      <!-- Step 2: Question -->
      <div id="step-2" style="display: none;">
        <div class="input-group">
          <label>Security Question</label>
          <div id="display-question" style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text);"></div>
          <input type="text" id="reset-answer" placeholder="Your answer" />
        </div>
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="new-password" placeholder="••••••••" />
        </div>
        <button class="auth-btn" onclick="resetPassword()">Reset Password</button>
      </div>

      <div style="margin-top: 24px; font-size: 13px;">
        <a href="/login" style="color: var(--accent); text-decoration: none;">Back to Login</a>
      </div>
    </div>

    <script>
      let userEmail = '';

      async function findAccount() {
        const email = document.getElementById('reset-email').value;
        const errEl = document.getElementById('error-msg');
        if (!email) return;

        try {
          const res = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (res.ok) {
            userEmail = email;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            document.getElementById('display-question').textContent = data.question;
            document.getElementById('step-desc').textContent = 'Answer your security question to reset your password.';
            errEl.style.display = 'none';
          } else {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
          }
        } catch (e) {
          errEl.textContent = 'Error connecting to server.';
          errEl.style.display = 'block';
        }
      }

      async function resetPassword() {
        const answer = document.getElementById('reset-answer').value;
        const newPassword = document.getElementById('new-password').value;
        const errEl = document.getElementById('error-msg');
        const succEl = document.getElementById('success-msg');

        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail, answer, newPassword })
          });
          const data = await res.json();
          if (res.ok) {
            succEl.textContent = 'Password reset successfully! Redirecting...';
            succEl.style.display = 'block';
            errEl.style.display = 'none';
            setTimeout(() => window.location.href = '/login', 2000);
          } else {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
          }
        } catch (e) {
          errEl.textContent = 'Error connecting to server.';
          errEl.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
