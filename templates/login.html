<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - NeuroTutor</title>
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dark.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }
      .auth-container {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .auth-container h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 24px;
      }
      .input-group {
        margin-bottom: 16px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        color: var(--subtext);
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        box-sizing: border-box;
        font-size: 14px;
      }
      .input-group input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .auth-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 10px;
      }
      .auth-btn:hover {
        opacity: 0.9;
      }
      .auth-footer {
        margin-top: 20px;
        font-size: 13px;
        color: var(--subtext);
      }
      .auth-footer a {
        color: var(--accent);
        text-decoration: none;
      }
      .error-msg {
        color: #f44336;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
    </style>
  </head>
  <body class="dark">
    <div class="auth-container">
      <div style="font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 8px;">N</div>
      <h2>Welcome Back</h2>
      
      {% if message %}
      <div style="color: #4caf50; font-size: 13px; margin-bottom: 16px;">{{ message }}</div>
      {% endif %}

      <div class="error-msg" id="error-msg"></div>

      <form id="login-form">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="auth-btn" id="submit-btn">Sign In</button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up</a>
      </div>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submit-btn');
        const errEl = document.getElementById('error-msg');
        
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        errEl.style.display = 'none';

        try {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ email, password })
          });
          
          const data = await res.json();
          if (res.ok) {
            window.location.href = '/';
          } else {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        } catch (err) {
          errEl.textContent = 'Connection error.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
